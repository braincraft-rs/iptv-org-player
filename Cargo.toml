[package]
name = "iptv-org-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"] }
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["datepicker", "http", "image", "svg"] }
glow = "0.17"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jiff = "0.2.42"
libmpv2 = { version = "6.0.0", features = ["render"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
